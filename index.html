:root{--bg:#F0F0EE;--surface:#FFFFFF;--ink:#111111;--tx-2:rgba(0,0,0,.55);--tx-3:rgba(0,0,0,.38);--line:rgba(0,0,0,.12);--green:#22AA66;}
@media (prefers-color-scheme:dark){:root{--bg:#131313;--surface:#1C1C1C;--ink:#F2F2F0;--tx-2:rgba(255,255,255,.58);--tx-3:rgba(255,255,255,.38);--line:rgba(255,255,255,.12);}}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;}
.top{background:#111;padding:env(safe-area-inset-top,0px) 20px 0;}
.top-in{height:56px;display:flex;align-items:center;max-width:720px;margin:0 auto;}
.wm{font-family:Zodiak,Georgia,serif;font-weight:700;font-size:1.15rem;letter-spacing:.04em;color:#fff;}
.wm i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:4px;vertical-align:middle;}
main{max-width:720px;margin:0 auto;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px));}
h1{font-family:Zodiak,Georgia,serif;font-weight:700;font-size:clamp(1.9rem,7vw,2.6rem);letter-spacing:-.01em;line-height:1.05;margin:0 0 6px;}
.sub{margin:0 0 22px;font-size:.95rem;color:var(--tx-2);}
.apps{display:grid;gap:12px;}
.app{display:flex;align-items:center;gap:16px;min-height:96px;padding:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;transition:transform .12s ease,border-color .12s ease;}
.app:hover{border-color:var(--ink);} .app:active{transform:scale(.985);}
.app:focus-visible{outline:3px solid var(--green);outline-offset:2px;}
.app img{width:60px;height:60px;border-radius:14px;flex-shrink:0;}
.app b{display:block;font-family:Zodiak,Georgia,serif;font-weight:700;font-size:1.35rem;line-height:1.1;}
.app span{display:block;margin-top:4px;font-size:.92rem;color:var(--tx-2);}
.app .go{margin-left:auto;font-size:1.6rem;color:var(--tx-3);}
</style>
