name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity. This makes one tiny
# read every day so ShowComm and ShowGear are always ready when a show loads in.
on:
  schedule:
    - cron: "17 11 * * *"     # every day at 11:17 UTC (7:17 AM New York time)
  workflow_dispatch:           # "Run workflow" button, for testing

permissions:
  contents: write              # only for the monthly heartbeat below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY="sb_publishable_DyTGUldcqxU9t7-170atFA_n-iTjNPv"
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' \
            "https://saipvaleecyryrjnnufs.supabase.co/rest/v1/etk_options?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $code: $(cat /tmp/r.json)"
          test "$code" = "200"

      # GitHub switches off scheduled jobs in a repo with no commits for 60 days.
      # On the 1st of each month, record a heartbeat so this schedule stays on.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Monthly heartbeat
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
            git config user.name "ShowPoint heartbeat"
            git config user.email "actions@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "Monthly heartbeat (keeps the daily Supabase ping scheduled)"
            git push
          else
            echo "Not the 1st; no heartbeat needed today."
          fi
