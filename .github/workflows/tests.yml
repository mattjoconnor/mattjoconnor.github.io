name: Tests

# Runs every ShowComm, ShowGear and ShowPoint test on each push. The three repos are laid out
# exactly like the live site (mattjoconnor.github.io/...), so the tests see what visitors see.
# A red X here means something broke, and GitHub emails you about it.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.repository }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get ShowPoint (site root)
        uses: actions/checkout@v4
        with:
          repository: mattjoconnor/mattjoconnor.github.io
          ref: ${{ github.repository == 'mattjoconnor/mattjoconnor.github.io' && github.sha || 'main' }}
          path: site
      - name: Get ShowComm
        uses: actions/checkout@v4
        with:
          repository: mattjoconnor/showcomm
          ref: ${{ github.repository == 'mattjoconnor/showcomm' && github.sha || 'main' }}
          path: site/showcomm
      - name: Get ShowGear
        uses: actions/checkout@v4
        with:
          repository: mattjoconnor/showgear
          ref: ${{ github.repository == 'mattjoconnor/showgear' && github.sha || 'main' }}
          path: site/showgear

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          cd site/_tests && npm install --no-audit --no-fund
          pip install "playwright==1.56.0" pillow
          python -m playwright install --with-deps chromium

      - name: Run every suite
        env:
          SITE: ${{ github.workspace }}/site
        run: python site/_tests/run_all.py

      - name: Keep screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/*.png
          if-no-files-found: ignore
